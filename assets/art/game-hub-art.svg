<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e1a"/>
      <stop offset="100%" stop-color="#08080d"/>
    </linearGradient>
    <radialGradient id="glowG1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c2f9e"/>
    </linearGradient>
    <linearGradient id="tile2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7f95"/>
    </linearGradient>
    <linearGradient id="tile3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#9d3d78"/>
    </linearGradient>
    <linearGradient id="tile4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#a4720f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgg)"/>
  <circle cx="1000" cy="120" r="320" fill="url(#glowG1)"/>
  <circle cx="150" cy="560" r="300" fill="url(#glowG2)"/>

  <!-- search bar -->
  <rect x="90" y="80" width="480" height="56" rx="28" fill="#12101e" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="126" cy="108" r="9" fill="none" stroke="#8d8da3" stroke-width="2.5"/>
  <line x1="133" y1="115" x2="141" y2="123" stroke="#8d8da3" stroke-width="2.5" stroke-linecap="round"/>
  <text x="156" y="114" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#6d6d80">Search for a game...</text>

  <!-- wordmark -->
  <g transform="translate(90,190)">
    <rect x="0" y="0" width="46" height="34" rx="8" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="12" cy="17" r="3" fill="#22d3ee"/>
    <circle cx="34" cy="10" r="3" fill="#22d3ee"/>
    <circle cx="34" cy="24" r="3" fill="#22d3ee"/>
    <text x="60" y="27" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="700" fill="#f2f2f7">GameHub</text>
  </g>

  <!-- game tile grid -->
  <g>
    <rect x="90" y="270" width="220" height="280" rx="16" fill="url(#tile1)"/>
    <rect x="330" y="270" width="220" height="280" rx="16" fill="url(#tile2)"/>
    <rect x="570" y="270" width="220" height="280" rx="16" fill="url(#tile3)"/>
    <rect x="810" y="270" width="220" height="280" rx="16" fill="url(#tile4)"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.85" font-family="IBM Plex Sans, sans-serif" font-size="14">
    <rect x="106" y="480" width="120" height="14" rx="7" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="346" y="480" width="120" height="14" rx="7" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="586" y="480" width="120" height="14" rx="7" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="826" y="480" width="120" height="14" rx="7" fill="#ffffff" fill-opacity="0.55"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2">
    <rect x="106" y="520" width="80" height="26" rx="13"/>
    <rect x="346" y="520" width="80" height="26" rx="13"/>
    <rect x="586" y="520" width="80" height="26" rx="13"/>
    <rect x="826" y="520" width="80" height="26" rx="13"/>
  </g>
  <g fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="12" text-anchor="middle">
    <text x="146" y="537">PLAY</text>
    <text x="386" y="537">PLAY</text>
    <text x="626" y="537">PLAY</text>
    <text x="866" y="537">PLAY</text>
  </g>

  <!-- results counter -->
  <text x="1090" y="112" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="16" fill="#22d3ee">414 results</text>
</svg>

<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0b1a"/>
      <stop offset="100%" stop-color="#08080d"/>
    </linearGradient>
    <radialGradient id="glowV1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1730"/>
      <stop offset="100%" stop-color="#100e1c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgv)"/>
  <circle cx="220" cy="150" r="320" fill="url(#glowV1)"/>
  <circle cx="1000" cy="560" r="300" fill="url(#glowV2)"/>

  <!-- circuit traces -->
  <g stroke="#8b5cf6" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 9" fill="none">
    <path d="M0,120 H360 L410,170 H1200"/>
    <path d="M0,540 H260 L310,490 H1200"/>
    <path d="M150,0 V675"/>
    <path d="M1050,0 V675"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="150" cy="120" r="4"/>
    <circle cx="1050" cy="540" r="4"/>
    <circle cx="410" cy="170" r="4"/>
    <circle cx="310" cy="490" r="4"/>
  </g>

  <!-- radar pulse rings -->
  <g fill="none" stroke="#8b5cf6" stroke-opacity="0.5">
    <circle cx="600" cy="300" r="90" stroke-width="1.5"/>
    <circle cx="600" cy="300" r="130" stroke-width="1.2" stroke-opacity="0.3"/>
    <circle cx="600" cy="300" r="170" stroke-width="1" stroke-opacity="0.16"/>
  </g>

  <!-- central chip -->
  <g transform="translate(600,300)">
    <rect x="-70" y="-70" width="140" height="140" rx="22" fill="url(#chipGrad)" stroke="#8b5cf6" stroke-opacity="0.6" stroke-width="2"/>
    <!-- chip pins -->
    <g stroke="#8b5cf6" stroke-width="3" stroke-opacity="0.7">
      <line x1="-70" y1="-40" x2="-92" y2="-40"/>
      <line x1="-70" y1="0" x2="-92" y2="0"/>
      <line x1="-70" y1="40" x2="-92" y2="40"/>
      <line x1="70" y1="-40" x2="92" y2="-40"/>
      <line x1="70" y1="0" x2="92" y2="0"/>
      <line x1="70" y1="40" x2="92" y2="40"/>
    </g>
    <!-- waveform inside -->
    <polyline points="-45,10 -25,10 -15,-25 0,30 15,-10 30,10 45,10" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- readout panel -->
  <rect x="420" y="430" width="360" height="86" rx="14" fill="#100e1c" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="452" cy="460" r="7" fill="#22d3ee"/>
  <text x="472" y="466" font-family="JetBrains Mono, monospace" font-size="19" fill="#f2f2f7" font-weight="700">VAPE DETECTED</text>
  <text x="452" y="494" font-family="JetBrains Mono, monospace" font-size="15" fill="#8d8da3">confidence: 92%</text>

  <!-- sensor chips row -->
  <g font-family="JetBrains Mono, monospace" font-size="15" fill="#8d8da3">
    <rect x="90" y="565" width="120" height="40" rx="20" fill="#12101e" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <text x="150" y="590" text-anchor="middle" fill="#c9c9e0">PM2.5</text>

    <rect x="230" y="565" width="100" height="40" rx="20" fill="#12101e" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <text x="280" y="590" text-anchor="middle" fill="#c9c9e0">GAS</text>

    <rect x="350" y="565" width="110" height="40" rx="20" fill="#12101e" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <text x="405" y="590" text-anchor="middle" fill="#c9c9e0">TEMP</text>

    <rect x="880" y="565" width="130" height="40" rx="20" fill="#12101e" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="945" y="590" text-anchor="middle" fill="#c9c9e0">UART</text>

    <rect x="1030" y="565" width="150" height="40" rx="20" fill="#12101e" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="1105" y="590" text-anchor="middle" fill="#c9c9e0">PICO W</text>
  </g>
</svg>

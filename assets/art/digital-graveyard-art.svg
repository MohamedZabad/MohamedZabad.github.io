<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1014"/>
      <stop offset="100%" stop-color="#08090c"/>
    </linearGradient>
    <radialGradient id="gA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5a524" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2f38"/>
      <stop offset="100%" stop-color="#171a20"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="980" cy="560" r="340" fill="url(#gA)"/>
  <circle cx="160" cy="90" r="300" fill="url(#gC)"/>

  <!-- wordmark -->
  <g transform="translate(80,78)">
    <path d="M0 40 V16 A14 14 0 0 1 28 16 V40 Z" fill="none" stroke="#f5a524" stroke-width="3"/>
    <line x1="14" y1="12" x2="14" y2="28" stroke="#f5a524" stroke-width="3" stroke-linecap="round"/>
    <line x1="8" y1="18" x2="20" y2="18" stroke="#f5a524" stroke-width="3" stroke-linecap="round"/>
    <text x="44" y="34" font-family="Space Grotesk, sans-serif" font-size="30" font-weight="700" fill="#eef0f3">Digital Graveyard</text>
  </g>

  <!-- aging score panel -->
  <g transform="translate(80,160)">
    <rect width="400" height="250" rx="20" fill="#12151b" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="30" y="46" font-family="JetBrains Mono, monospace" font-size="15" fill="#8b93a1">DIGITAL AGING SCORE</text>
    <circle cx="110" cy="150" r="62" fill="none" stroke="#232831" stroke-width="14"/>
    <circle cx="110" cy="150" r="62" fill="none" stroke="#f5a524" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="242 390" transform="rotate(-90 110 150)"/>
    <text x="110" y="162" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="40" font-weight="700" fill="#eef0f3">62</text>
    <text x="210" y="132" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="700" fill="#f5a524">Dusty</text>
    <text x="210" y="164" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#8b93a1">41 accounts found</text>
    <text x="210" y="190" font-family="IBM Plex Sans, sans-serif" font-size="16" fill="#8b93a1">17 not reviewed</text>
  </g>

  <!-- spend panel -->
  <g transform="translate(80,436)">
    <rect width="400" height="160" rx="20" fill="#12151b" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="30" y="46" font-family="JetBrains Mono, monospace" font-size="15" fill="#8b93a1">MONTHLY SPEND</text>
    <text x="30" y="98" font-family="Space Grotesk, sans-serif" font-size="40" font-weight="700" fill="#eef0f3">$38.97</text>
    <rect x="30" y="118" width="190" height="26" rx="13" fill="#22d3ee" fill-opacity="0.14"/>
    <text x="46" y="136" font-family="IBM Plex Sans, sans-serif" font-size="14" fill="#22d3ee">Save $14.98 / month</text>
  </g>

  <!-- graveyard: ground line + tombstones -->
  <line x1="540" y1="560" x2="1130" y2="560" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <g transform="translate(560,300)">
    <path d="M0 260 V70 A80 80 0 0 1 160 70 V260 Z" fill="url(#stone)" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="80" y="92" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#8b93a1">RIP</text>
    <text x="80" y="138" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="600" fill="#eef0f3">Photo app</text>
    <text x="80" y="166" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#8b93a1">2016 – 2018</text>
    <rect x="28" y="196" width="104" height="26" rx="13" fill="#f5a524" fill-opacity="0.16"/>
    <text x="80" y="214" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#f5a524">Forgotten</text>
  </g>

  <g transform="translate(750,250)">
    <path d="M0 310 V80 A90 90 0 0 1 180 80 V310 Z" fill="url(#stone)" stroke="#f5a524" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="90" y="100" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#8b93a1">RIP</text>
    <text x="90" y="150" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="600" fill="#eef0f3">Music trial</text>
    <text x="90" y="178" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#8b93a1">$9.99 / month</text>
    <rect x="32" y="210" width="116" height="26" rx="13" fill="#22d3ee" fill-opacity="0.16"/>
    <text x="90" y="228" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#22d3ee">Cancelled</text>
  </g>

  <g transform="translate(960,320)">
    <path d="M0 240 V64 A72 72 0 0 1 144 64 V240 Z" fill="url(#stone)" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="72" y="86" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#8b93a1">RIP</text>
    <text x="72" y="128" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="19" font-weight="600" fill="#eef0f3">Old forum</text>
    <text x="72" y="154" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="15" fill="#8b93a1">Last email 2017</text>
    <rect x="24" y="180" width="96" height="26" rx="13" fill="#ef4444" fill-opacity="0.16"/>
    <text x="72" y="198" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" fill="#f87171">Deleted</text>
  </g>

  <!-- inbox scan chip -->
  <g transform="translate(760,120)">
    <rect width="340" height="58" rx="29" fill="#12151b" stroke="#22d3ee" stroke-opacity="0.45"/>
    <rect x="22" y="19" width="28" height="20" rx="3" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    <path d="M22 21 L36 31 L50 21" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
    <text x="66" y="36" font-family="IBM Plex Sans, sans-serif" font-size="17" fill="#eef0f3">Scanning headers only…</text>
  </g>
</svg>

<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0f1a"/>
      <stop offset="100%" stop-color="#08080d"/>
    </linearGradient>
    <radialGradient id="glowC1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1830"/>
      <stop offset="100%" stop-color="#12101e"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgc)"/>
  <circle cx="1050" cy="120" r="320" fill="url(#glowC1)"/>
  <circle cx="150" cy="580" r="300" fill="url(#glowC2)"/>

  <!-- top bar: logo + cart -->
  <g font-family="Space Grotesk, sans-serif">
    <text x="90" y="100" font-size="28" font-weight="700" fill="#f2f2f7">My Store</text>
  </g>
  <g transform="translate(1000,66)">
    <rect x="0" y="0" width="110" height="42" rx="21" fill="#12101e" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="26" cy="21" r="8" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="26" cy="21" r="2" fill="#22d3ee"/>
    <path d="M20,17 h4 l3,9 h-8 z" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linejoin="round"/>
    <text x="70" y="27" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#f2f2f7">Cart (3)</text>
  </g>
  <line x1="90" y1="140" x2="1110" y2="140" stroke="#8d8da3" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- product grid: 4 cards -->
  <g>
    <!-- card 1 -->
    <rect x="90" y="180" width="240" height="300" rx="16" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-opacity="0.35"/>
    <rect x="112" y="202" width="196" height="140" rx="10" fill="#22d3ee" fill-opacity="0.18"/>
    <path d="M150,300 l30,-40 26,32 20,-24 40,52 z" fill="#22d3ee" fill-opacity="0.55"/>
    <circle cx="270" cy="230" r="12" fill="#fbbf24" fill-opacity="0.7"/>
    <rect x="112" y="358" width="150" height="16" rx="8" fill="#f2f2f7" fill-opacity="0.85"/>
    <text x="112" y="404" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22d3ee">$24.99</text>
    <rect x="112" y="424" width="196" height="36" rx="18" fill="url(#ctaGrad)"/>
    <text x="210" y="447" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#0a0a0f">View</text>

    <!-- card 2 -->
    <rect x="350" y="180" width="240" height="300" rx="16" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-opacity="0.35"/>
    <rect x="372" y="202" width="196" height="140" rx="10" fill="#8b5cf6" fill-opacity="0.18"/>
    <circle cx="470" cy="272" r="42" fill="#8b5cf6" fill-opacity="0.5"/>
    <rect x="372" y="358" width="130" height="16" rx="8" fill="#f2f2f7" fill-opacity="0.85"/>
    <text x="372" y="404" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22d3ee">$59.00</text>
    <rect x="372" y="424" width="196" height="36" rx="18" fill="url(#ctaGrad)"/>
    <text x="470" y="447" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#0a0a0f">View</text>

    <!-- card 3 -->
    <rect x="610" y="180" width="240" height="300" rx="16" fill="url(#cardGrad)" stroke="#22d3ee" stroke-opacity="0.45"/>
    <rect x="632" y="202" width="196" height="140" rx="10" fill="#f472b6" fill-opacity="0.18"/>
    <rect x="666" y="230" width="128" height="84" rx="8" fill="#f472b6" fill-opacity="0.5"/>
    <rect x="632" y="358" width="170" height="16" rx="8" fill="#f2f2f7" fill-opacity="0.85"/>
    <text x="632" y="404" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22d3ee">$18.50</text>
    <rect x="632" y="424" width="196" height="36" rx="18" fill="url(#ctaGrad)"/>
    <text x="730" y="447" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#0a0a0f">View</text>

    <!-- card 4 -->
    <rect x="870" y="180" width="240" height="300" rx="16" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-opacity="0.35"/>
    <rect x="892" y="202" width="196" height="140" rx="10" fill="#fbbf24" fill-opacity="0.18"/>
    <path d="M900,320 l40,-70 30,40 26,-30 42,60 z" fill="#fbbf24" fill-opacity="0.55"/>
    <rect x="892" y="358" width="140" height="16" rx="8" fill="#f2f2f7" fill-opacity="0.85"/>
    <text x="892" y="404" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="#22d3ee">$32.00</text>
    <rect x="892" y="424" width="196" height="36" rx="18" fill="url(#ctaGrad)"/>
    <text x="990" y="447" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" fill="#0a0a0f">View</text>
  </g>

  <!-- checkout affordance -->
  <rect x="90" y="530" width="310" height="52" rx="26" fill="url(#ctaGrad)" opacity="0.9"/>
  <text x="245" y="564" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="16" font-weight="600" fill="#0a0a0f">Proceed to Checkout</text>

  <!-- order confirmation chip -->
  <g font-family="JetBrains Mono, monospace" font-size="14" fill="#c9c9e0">
    <rect x="430" y="530" width="230" height="52" rx="26" fill="#12101e" stroke="#22d3ee" stroke-opacity="0.5"/>
    <circle cx="463" cy="556" r="6" fill="#22d3ee"/>
    <text x="480" y="562">Order #1042 placed</text>
  </g>
</svg>
